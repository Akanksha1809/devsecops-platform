# DaemonSet means exactly 1 pod on this single-node kind cluster — node
# CPU/memory metrics, not per-pod (per-pod/cAdvisor metrics need kubelet
# TLS access, the same gotcha that made Phase 3 defer metrics-server; see
# docs/IMPLEMENTATION_PLAN.md §4e).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      serviceAccountName: node-exporter
      # node-exporter never calls the Kubernetes API -- it only reads
      # host /proc and /sys. (checkov CKV_K8S_38)
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      securityContext:
        # Pod-level seccomp on top of the container-level hardening below
        # (checkov CKV_K8S_31). hostNetwork/hostPID are unrelated to
        # seccomp (syscall filtering, not namespace sharing) and this is
        # compatible with node-exporter's normal operation.
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          ports:
            # No hostPort here: hostNetwork: true above already puts this
            # container directly on the host's network namespace, so
            # containerPort 9100 *is* host port 9100 — an explicit
            # hostPort would be redundant, and checkov (CKV_K8S_26) flags
            # it as unnecessary for exactly that reason.
            - containerPort: 9100
              name: http
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    app.kubernetes.io/name: node-exporter
  ports:
    - name: http
      port: 9100
      targetPort: http
