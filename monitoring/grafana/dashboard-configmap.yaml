apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-devsecops-app
  namespace: monitoring
data:
  devsecops-app.json: |
    {
      "title": "DevSecOps Platform — App & Cluster",
      "uid": "devsecops-app",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP request rate by status",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"devsecops-dev\"}[5m])) by (status)",
              "legendFormat": "{{status}}",
              "datasource": { "type": "prometheus", "uid": "Prometheus" }
            }
          ]
        },
        {
          "id": 2,
          "title": "5xx error ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"devsecops-dev\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"devsecops-dev\"}[5m]))",
              "legendFormat": "error ratio",
              "datasource": { "type": "prometheus", "uid": "Prometheus" }
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 request latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"devsecops-dev\"}[5m])) by (le))",
              "legendFormat": "p95",
              "datasource": { "type": "prometheus", "uid": "Prometheus" }
            }
          ]
        },
        {
          "id": 4,
          "title": "Ready app pods (devsecops-dev)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"devsecops-dev\",condition=\"true\"})",
              "legendFormat": "ready pods",
              "datasource": { "type": "prometheus", "uid": "Prometheus" }
            }
          ]
        },
        {
          "id": 5,
          "title": "Node memory available",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 0.15 },
                  { "color": "green", "value": 0.3 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
              "legendFormat": "available",
              "datasource": { "type": "prometheus", "uid": "Prometheus" }
            }
          ]
        }
      ]
    }
