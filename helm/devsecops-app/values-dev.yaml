namespace: devsecops-dev
# 4, not 1: with replicas=1 the canary steps' setWeight 25/50/100 can't
# divide meaningfully into replica counts (Argo Rollouts' basic canary,
# with no traffic-routing plugin, approximates weight via replica ratio —
# see values.yaml's canary comment). 4 gives a real 1/2/4 progression.
replicaCount: 4
app:
  logLevel: DEBUG
  version: "0.3.0-bad"
  # Deliberately unhealthy release (Phase 5's abort/rollback scenario):
  # flips /ready to 503. The canary AnalysisTemplate probes exactly this,
  # so this should fail the analysis and abort before 100% promotion —
  # see docs/IMPLEMENTATION_PLAN.md §4d for the real, observed outcome.
  simulateUnhealthy: true
