namespace: devsecops-dev
# 4, not 1: with replicas=1 the canary steps' setWeight 25/50/100 can't
# divide meaningfully into replica counts (Argo Rollouts' basic canary,
# with no traffic-routing plugin, approximates weight via replica ratio —
# see values.yaml's canary comment). 4 gives a real 1/2/4 progression.
replicaCount: 4
app:
  logLevel: DEBUG
  version: "0.2.0"
  # Reverted after the Phase 5 bad-release demo (was 0.3.0-bad /
  # simulateUnhealthy: true). Discovered the hard way that
  # APP_SIMULATE_UNHEALTHY is shared config, not per-revision — see
  # docs/IMPLEMENTATION_PLAN.md §4d's "shared ConfigMap blast radius"
  # finding before reusing this toggle for a future demo.
  simulateUnhealthy: false
