apiVersion: v1
kind: Service
metadata:
  name: {{ include "devsecops-app.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devsecops-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
