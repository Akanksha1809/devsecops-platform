# A Rollout, not a plain Deployment — Argo Rollouts drives progressive
# delivery (canary) for this workload. See docs/IMPLEMENTATION_PLAN.md §4d.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "devsecops-app.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: {{ .Values.canary.progressDeadlineSeconds }}
  progressDeadlineAbort: {{ .Values.canary.progressDeadlineAbort }}
  strategy:
    canary:
      canaryService: {{ .Values.canary.canaryServiceName }}
      stableService: {{ .Values.canary.stableServiceName }}
      steps:
        {{- range .Values.canary.steps }}
        {{- if hasKey . "setWeight" }}
        - setWeight: {{ .setWeight }}
        {{- else if hasKey . "pauseSeconds" }}
        - pause:
            duration: {{ printf "%ds" (.pauseSeconds | int) | quote }}
        {{- else if hasKey . "runAnalysis" }}
        - analysis:
            templates:
              - templateName: {{ $.Values.canary.analysisTemplateName }}
        {{- end }}
        {{- end }}
  selector:
    matchLabels:
      {{- include "devsecops-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Forces a new ReplicaSet (and therefore a real canary rollout)
        # when the ConfigMap's data changes — referencing a ConfigMap by
        # name alone doesn't trigger a rollout on its own, since the pod
        # template itself wouldn't otherwise change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Annotation-based Prometheus discovery (Phase 6) — no
        # ServiceMonitor CRD / Prometheus Operator installed, see
        # monitoring/prometheus/configmap.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "devsecops-app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "devsecops-app.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.vault.enabled }}
      initContainers:
        - name: vault-secret-fetch
          image: {{ .Values.vault.image }}
          command:
            - sh
            - -c
            - |
              set -e
              LOGIN_TOKEN=$(vault write -field=token auth/kubernetes/login \
                role={{ .Values.vault.role }} jwt=@/var/run/secrets/vault/token)
              VAULT_TOKEN="$LOGIN_TOKEN" vault kv get -format=json {{ .Values.vault.secretPath }} \
                > /vault/secrets/example.json
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.address | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
      {{- end }}
      containers:
        - name: {{ include "devsecops-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "devsecops-app.name" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.vault.enabled }}
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.vault.enabled }}
        - name: vault-secrets
          emptyDir: {}
        - name: vault-token
          # Scoped to only this initContainer's mount, not pod-wide
          # automountServiceAccountToken -- the main container above
          # never gets a Kubernetes API token at all.
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
