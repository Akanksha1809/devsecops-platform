{{- if .Values.networkPolicy.enabled }}
# CORRECTION (Phase 5): this CNI *does* enforce NetworkPolicy on this kind
# version, contrary to what Phase 3 assumed from general kindnet history —
# proven when Argo Rollouts' AnalysisRun (running in the argo-rollouts
# namespace) couldn't reach the canary Service at all, while a same-
# namespace curl worked fine. See docs/IMPLEMENTATION_PLAN.md §4d for the
# empirical before/after. The ingress rule below now explicitly allows the
# cross-namespace callers this project actually has.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsecops-app.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devsecops-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {} # other pods in this namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts # AnalysisRun health probes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring # Prometheus scrape + Alertmanager webhook (Phase 6)
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # The app has no external dependencies — DNS is the only egress it
    # genuinely needs. Kept this tight deliberately rather than opening
    # egress broadly "just in case".
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.vault.enabled }}
    # The initContainer (not the main container) calls out to Vault for
    # the Kubernetes-auth login and secret fetch (Phase 8). Same pod,
    # same NetworkPolicy -- egress rules apply per-pod, not per-container.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
    {{- end }}
{{- end }}
