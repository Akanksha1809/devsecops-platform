{{- if .Values.networkPolicy.enabled }}
# NOTE: kind's default CNI (kindnet) does not enforce NetworkPolicy — see
# docs/IMPLEMENTATION_PLAN.md §1 and values.yaml's networkPolicy comment.
# This documents and validates the intended rules; it does not currently
# block any traffic on this cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsecops-app.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devsecops-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # The app has no external dependencies — DNS is the only egress it
    # genuinely needs. Kept this tight deliberately rather than opening
    # egress broadly "just in case".
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
