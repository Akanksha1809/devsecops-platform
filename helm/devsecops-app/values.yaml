# Base defaults. values-dev.yaml / values-staging.yaml override only what
# actually differs per environment (replica count, log level, namespace) —
# see docs/ARCHITECTURE.md for why Helm was chosen over Kustomize here.

nameOverride: "devsecops-app"
namespace: devsecops-dev

replicaCount: 1

# IfNotPresent, not Always: no environment in this project pulls from a
# real registry yet (kind load docker-image loads a local image that was
# never pushed anywhere — GHCR publish exists in the Jenkinsfile but isn't
# exercised, see IMPLEMENTATION_PLAN.md §4a). checkov (CKV_K8S_15) flags
# this as a finding; accepted and documented, not fixed, because Always
# would just fail to pull on every environment this project currently has.
# Revisit once Argo CD deploys from GHCR images in Phase 4.
image:
  repository: devsecops-platform-app
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: NodePort
  port: 8000
  nodePort: 30080

app:
  logLevel: INFO
  simulateUnhealthy: false
  # version/gitSha are overridden at deploy time by CI with the real build
  # identifiers (see Jenkinsfile) — these are placeholders for local/manual use.
  version: "0.1.0"
  gitSha: "local"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  startup:
    path: /health
    periodSeconds: 2
    failureThreshold: 15 # 30s to come up before liveness starts counting

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

# Canary is this project's one progressive-delivery strategy (the brief
# allows picking one as the main demo and leaving a second, e.g.
# blue-green, as a documented-but-unbuilt extension — see
# docs/IMPLEMENTATION_PLAN.md §4d for why). No traffic-routing plugin
# (Istio/nginx/ALB/SMI) is installed, so setWeight approximates traffic
# split by replica ratio behind the shared Service — canaryService/
# stableService below exist only so the AnalysisTemplate can target the
# canary pods specifically, independent of that shared Service.
canary:
  # 60s, not the 600s default: this project's demo-scale canary steps are
  # tens of seconds each, so a 600s deadline would never trip in any demo
  # that doesn't involve literally waiting 10 minutes. progressDeadlineAbort
  # is what actually makes an exceeded deadline abort the rollout (and roll
  # traffic back to 100% stable) instead of merely surfacing a condition.
  progressDeadlineSeconds: 60
  progressDeadlineAbort: true
  canaryServiceName: devsecops-app-canary
  stableServiceName: devsecops-app-stable
  analysisTemplateName: devsecops-app-canary-health
  steps:
    - setWeight: 25
    - pauseSeconds: 10
    - runAnalysis: true
    - setWeight: 50
    - pauseSeconds: 10
    - setWeight: 100

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

networkPolicy:
  # CORRECTED in Phase 5: this CNI *does* enforce NetworkPolicy (Phase 3
  # assumed otherwise, based on general kindnet history, not this specific
  # version) — confirmed when it silently blocked Argo Rollouts' canary
  # health probes cross-namespace. See docs/IMPLEMENTATION_PLAN.md §4d.
  enabled: true

# Phase 8: demonstrates real secret injection (no static Vault token
# anywhere in this chart) without the app actually needing the fetched
# value for anything -- see docs/IMPLEMENTATION_PLAN.md §4g for why that's
# deliberate, not half-finished. Only the initContainer below gets a
# ServiceAccount token at all (via its own projected volume, not the pod-
# wide automountServiceAccountToken, which stays false on the main
# container per serviceAccount.automountServiceAccountToken above).
vault:
  enabled: true
  image: hashicorp/vault:1.18
  address: http://vault.vault.svc:8200
  role: devsecops-app
  # CLI/logical KV-v2 path (what `vault kv get` takes) -- NOT the same
  # string as the policy path in terraform/environments/local/vault.tf,
  # which needs an explicit "data/" segment the CLI inserts for you.
  secretPath: devsecops/devsecops-app/example
