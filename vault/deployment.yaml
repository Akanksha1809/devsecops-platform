# Vault dev-server mode — NOT a production configuration. Dev mode:
# auto-unseals, stores everything in memory (lost on pod restart), has
# no TLS, and prints a freshly-generated root token to its own stdout
# logs on every startup (VAULT_DEV_ROOT_TOKEN_ID is deliberately left
# unset here so that token is never a fixed, committable value — see
# docs/IMPLEMENTATION_PLAN.md §4g). A real deployment would run Vault in
# HA mode with a real storage backend, proper unseal (Shamir or a cloud
# KMS), TLS, and would never use dev mode at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
# Lets Vault's Kubernetes auth method validate service account tokens
# via its own pod identity (TokenReview), instead of needing a separate
# static reviewer JWT configured by hand.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: true
      securityContext:
        # Real finding (read the actual entrypoint script to confirm,
        # not assumed): it only tries to su-exec from root down to the
        # image's own "vault" user (uid 100, gid 1000) when it detects
        # it's running as uid 0. su-exec itself then failed under our
        # dropped capabilities ("setgroups: Operation not permitted").
        # Starting directly as uid 100 skips that whole privilege-drop
        # path, which is also strictly more locked-down than relying on
        # a root->non-root transition inside the container.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:1.18
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            # No VAULT_LOCAL_CONFIG: that env var makes the entrypoint
            # script write /vault/config/local.json, which isn't a
            # writable path in this container (found by actually running
            # it: "Permission denied") and isn't needed anyway -- the
            # `-dev` server flags below are already everything dev mode
            # requires.
            # SKIP_CHOWN: the chown-logs/chown-file steps only apply when
            # running as root; irrelevant now, but explicit rather than
            # relying on the uid-100 path never reaching that branch.
            - name: SKIP_CHOWN
              value: "true"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            # The entrypoint's setcap(cap_ipc_lock) step needs
            # CAP_SETFCAP, which `capabilities.drop: ["ALL"]` below
            # removes -- confirmed by reading the real entrypoint script
            # (docker run --entrypoint cat .../docker-entrypoint.sh),
            # which documents SKIP_SETCAP as the supported way to skip
            # it. mlock isn't needed in dev mode anyway.
            - name: SKIP_SETCAP
              value: "true"
          ports:
            - name: http
              containerPort: 8200
          securityContext:
            allowPrivilegeEscalation: false
            # NOT readOnlyRootFilesystem: true -- tested it directly
            # (plain `docker run --read-only`, twice, once with a tmpfs
            # at /home/vault too): dev mode writes a token cache to
            # /home/vault/.vault-token.tmp and fails to start without
            # write access there. checkov (CKV_K8S_22) flags this;
            # accepted, since this is dev-mode-only infrastructure to
            # begin with (see the warning at the top of this file) and
            # not worth a third crash-loop cycle chasing a cosmetic check
            # a plain `docker run` can't fully rule out either way
            # (Kubernetes' fsGroup semantics for emptyDir aren't
            # replicable in that test).
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: http
            initialDelaySeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: audit
              mountPath: /vault/audit
      volumes:
        - name: tmp
          emptyDir: {}
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: http
      port: 8200
      targetPort: http
