# Staging is deliberately NOT auto-synced (no spec.syncPolicy.automated) —
# dev reconciles on every push, but promotion to staging is a deliberate
# action (`argocd app sync devsecops-app-staging`, or click Sync in the
# UI), which is this project's promotion gate from dev to staging. See
# docs/IMPLEMENTATION_PLAN.md §4c.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akanksha1809/devsecops-platform.git
    targetRevision: main
    path: helm/devsecops-app
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
