# Plain Kubernetes manifests (directory recurse), not Helm -- this stack
# is cluster-wide infra, not a per-environment app, so there's no
# dev/staging value-overlay need the way the app has. Auto-synced like
# dev: this is infrastructure, not something that should need a human to
# promote.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akanksha1809/devsecops-platform.git
    targetRevision: main
    path: monitoring
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
