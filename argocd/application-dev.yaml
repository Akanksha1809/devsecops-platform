# GitOps desired state for the dev environment. Argo CD renders
# helm/devsecops-app directly from Git (this repo) — Jenkins never runs
# helm/kubectl against the cluster; it only ever changes files in Git
# (see docs/ARCHITECTURE.md once written). Automated sync + selfHeal +
# prune means a manual kubectl/helm change to anything this Application
# owns gets reverted back to match Git — that's the reconciliation demo
# in docs/IMPLEMENTATION_PLAN.md §4c.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akanksha1809/devsecops-platform.git
    targetRevision: main
    path: helm/devsecops-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
